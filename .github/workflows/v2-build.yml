name: V2 Build Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'portfolio-v2' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: v2
        run: npm install

      - name: Build V2
        working-directory: v2
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v2-dist
          path: v2/dist
          if-no-files-found: error

      - name: Prepare browser preview
        run: |
          rm -rf preview
          cp -R v2/dist preview
          sed -i 's#"/Portafolio/assets/#"./assets/#g' preview/index.html

      - name: Commit preview to V2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then
            echo "Preview is already up to date."
            exit 0
          fi
          git commit -m "preview: refresh Portfolio V2 build"
          git push origin HEAD:${{ github.head_ref || 'portfolio-v2' }}
